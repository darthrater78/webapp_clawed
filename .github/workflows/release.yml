name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Merged is not the same as tested. This job checks both before anything is
  # published, and hands the release job the CI run whose artifacts it ships.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) echo "Pre-release tag — skipping branch check."; exit 0 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Releases come from the default branch only."
            echo "Use a pre-release tag (e.g. v0.1.0-rc.1) for a feature-branch build."
            exit 1
          fi

      - name: Require a passing CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.id) \(.html_url)"')

            if [ -z "$runs" ]; then
              echo "::error::CI has never run for ${SHA}, so nothing has tested this commit."
              echo "Push the branch so CI runs on it, or dispatch it by hand" >&2
              echo "(Actions -> CI -> Run workflow), then re-tag." >&2
              exit 1
            fi

            passed=$(printf '%s\n' "$runs" | awk '$2 == "success" { print $3; exit }')
            if [ -n "$passed" ]; then
              echo "CI passed for ${SHA} (run ${passed})."
              echo "run_id=${passed}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::CI ran for ${SHA} and did not pass. Refusing to release."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "CI is still running for ${SHA} (${unfinished} unfinished) -- waiting."
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the CI run's artifacts
      contents: write # create the GitHub release
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches the version in the tagged commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app="$(node -p "require('./package.json').version")"
          worker="$(node -p "require('./worker/package.json').version")"
          if [ -z "$app" ]; then
            echo "::error::No version found in package.json. Refusing to publish."
            exit 1
          fi
          if [ "$app" != "$worker" ]; then
            echo "::error::package.json says ${app} but worker/package.json says ${worker}. Bump both."
            exit 1
          fi
          # A pre-release tag (v0.1.0-rc.1) must still be for the declared version.
          if [ "v${app}" != "${TAG%%-*}" ]; then
            echo "::error::Tag $TAG is on a commit that declares ${app}. Merge the release first, then tag the merged commit."
            exit 1
          fi

      # No rebuild: the files CI built and verified for this exact commit are the release.
      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.gate.outputs.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh run download "$RUN_ID" -R "$REPO" -n "release-${SHA}" -D release; then
            echo "::error::CI run ${RUN_ID} has no release-${SHA} artifact (expired after 30 days?)."
            echo "Re-run CI for this commit (Actions -> CI -> Run workflow), then re-run this workflow." >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"
          for kind in upload static-site; do
            test -s "release/clawdmeter-v${version}-${kind}.zip" \
              || { echo "::error::Missing clawdmeter-v${version}-${kind}.zip"; exit 1; }
          done

      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          {
            echo "**Deploying?** Upload \`clawdmeter-v${version}-upload.zip\` to your hosting"
            echo "platform — it's the app source for the platform to build. The static-site zip"
            echo "is only for a host that doesn't build for you."
            echo
            cat changelog-section.md
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "release/clawdmeter-v${version}-upload.zip#⬆️ Upload this to your hosting platform" \
            "release/clawdmeter-v${version}-static-site.zip#Static files (for a host that doesn't build for you)" \
            "release/SHA256SUMS.txt#Checksums" \
            -R "$REPO" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease_flag

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected=$(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          attached=$(gh release view "$GITHUB_REF_NAME" -R "$REPO" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$attached" ]; then
            echo "::error::Release assets do not match what was built."
            diff <(echo "$expected") <(echo "$attached") || true
            exit 1
          fi
          echo "Attached: $(echo "$attached" | tr '\n' ' ')"
