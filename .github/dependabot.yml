version: 2
updates:
  # GitHub Actions — keeps SHA pins and their version comments current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The static app
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Matches bunfig.toml's 24h supply-chain guard: skip versions under a day old.
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The Cloudflare Worker (its own package and lockfile)
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
